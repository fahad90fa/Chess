<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Local Stockfish Analysis</title>
  <style>
    :root { --bg:#262421; --fg:#e8e6e3; --accent:#7fa650; --muted:#9a978f; }
    body { width:280px; margin:0; background:var(--bg); color:var(--fg);
           font:13px/1.5 system-ui,Segoe UI,Roboto,sans-serif; padding:14px; }
    h1 { font-size:15px; margin:0 0 4px; }
    p.sub { margin:0 0 12px; color:var(--muted); font-size:12px; }
    button { width:100%; cursor:pointer; border:none; border-radius:6px; padding:9px;
             font-weight:700; font-size:13px; background:var(--accent); color:#12240a; margin-bottom:10px; }
    label { font-size:12px; color:var(--muted); display:block; margin:8px 0 4px; }
    select, input { width:100%; box-sizing:border-box; background:#1e1c1a; color:var(--fg);
             border:1px solid #444; border-radius:6px; padding:6px; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    .note { margin-top:12px; font-size:11px; color:#6c6a63; line-height:1.4; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <h1>♞ Stockfish Analysis</h1>
  <p class="sub">Local engine, no network. For analysis boards & study.</p>

  <button id="openStandalone">Open standalone analyzer</button>

  <label for="depth">Default analysis depth</label>
  <select id="depth">
    <option>12</option><option>15</option><option selected>18</option>
    <option>20</option><option>22</option><option>25</option>
  </select>

  <label for="hotkeyKey">Overlay toggle hotkey (on chess.com/analysis)</label>
  <div class="row">
    <label style="display:flex;align-items:center;gap:4px;margin:0;"><input type="checkbox" id="hkCtrl" style="width:auto" checked>Ctrl</label>
    <label style="display:flex;align-items:center;gap:4px;margin:0;"><input type="checkbox" id="hkShift" style="width:auto" checked>Shift</label>
    <label style="display:flex;align-items:center;gap:4px;margin:0;"><input type="checkbox" id="hkAlt" style="width:auto">Alt</label>
    <input type="text" id="hkKey" maxlength="1" value="E" style="flex:0 0 40px;text-align:center;text-transform:uppercase">
  </div>

  <div class="note">
    On <b>chess.com/analysis</b> a panel appears automatically. Toggle it with your hotkey.
    Use this only where engine help is allowed — not in live games against opponents.
  </div>

  <script src="popup.js"></script>
</body>
</html>
